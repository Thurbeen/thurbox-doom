# The DOOM pane.
#
# This plugin carries a WAD, so it is installed by CLONING it — the file-by-file
# path decodes what it fetches as UTF-8 and would corrupt game data:
#
#     thurbox-cli plugin install git+https://github.com/Thurbeen/thurbox-doom
#
# The clone lands at `<interface dir>/thurbox-doom/`, keeps its `.git` (so `update`
# is a fetch and your edits are protected), and `pane.source` below is what names
# the entry point inside it. Failing a manifest, install takes the single `.lua`
# under `plugins/`. The lock records the commit, which is why there is nothing to
# checksum here.
#
# NOT `thurbox-cli plugin install doom` — a bare name resolves into the thurbox
# repository's own examples, which is a different, smaller pane.
#
# No engine ships here. Which DOOM to run is the `program` setting; the pane says so
# until it is set. See the README.
name = "doom"
description = "DOOM in a pane: a program surface, a built engine and a WAD"
version = "v0.5.0"
requires_thurbox = ">=2.0"

pane = { source = "plugins/40_doom.lua", path = "plugins/40_doom.lua" }
